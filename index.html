<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Peregrine Gantt</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body style="font-family:Arial,sans-serif;text-align:center;padding:40px;">

  <h2>Opening Peregrine Gantt...</h2>
  <p>If Egnyte does not open automatically, click below.</p>

  <a id="openBtn"
     href="#"
     style="
       display:inline-block;
       padding:12px 18px;
       background:#222;
       color:white;
       text-decoration:none;
       border-radius:8px;
       font-weight:600;
     ">
    Open Full Gantt
  </a>

  <script>
    fetch("config.json?t=" + Date.now(), { cache: "no-store" })
      .then(response => response.json())
      .then(config => {
        const url = config.egnyteUrl;

        document.getElementById("openBtn").href = url;

        setTimeout(function () {
          window.location.href = url;
        }, 500);
      })
      .catch(err => {
        console.error(err);
        document.querySelector("h2").textContent =
          "Unable to load Gantt link";
      });
  </script>

</body>
</html>
